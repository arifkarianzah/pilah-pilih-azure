<!-- ==================== TRACKING ==================== -->
<div id="page-tracking" class="page">
  <div class="phone-frame app-frame">
    <div class="page-hdr">
      <button class="back-btn" onclick="goPage('home')"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <h2>🗺 Navigasi</h2>
      <button class="icon-btn" onclick="showToast('🔄 Refresh...')">🔄</button>
    </div>
    <div class="scroll-content">
      <div id="map" style="width: 100%; height: 350px; border-radius: 16px; margin-bottom: 20px; z-index: 1;"></div>
      <div class="nav-card" style="box-shadow: var(--sh-md); border: 1px solid var(--border); padding: 20px;">
        <div class="nc-route" style="margin-bottom: 20px; position: relative;">
          <div style="position: absolute; left: 15px; top: 20px; bottom: 20px; width: 2px; background: var(--border2); z-index: 0;"></div>
          <div class="nc-start" style="display:flex; align-items:flex-start; gap: 12px; margin-bottom: 16px; position: relative; z-index: 1;">
            <div style="background:var(--card); border: 2px solid var(--blue); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink: 0;"><img src="https://img.icons8.com/fluency-systems-filled/48/118EEA/marker.png" width="16" height="16"></div>
            <div>
              <p style="font-size:12px; color:var(--t4); font-weight:600; margin-bottom:2px;">POSISI SAYA (PETUGAS)</p>
              <h4 style="font-size:15px; color:var(--t2); margin:0;">Pekanbaru, Riau</h4>
            </div>
          </div>
          <div class="nc-end" style="display:flex; align-items:flex-start; gap: 12px; position: relative; z-index: 1;">
            <div style="background:var(--blue); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink: 0; box-shadow: var(--sh-blue);"><img src="https://img.icons8.com/fluency-systems-filled/48/FFFFFF/home.png" width="16" height="16"></div>
            <div>
              <p style="font-size:12px; color:var(--t4); font-weight:600; margin-bottom:2px;">TUJUAN PENJEMPUTAN</p>
              <h4 style="font-size:15px; color:var(--t2); margin:0; line-height: 1.4;">Jl. Sudirman No. 45, Pekanbaru</h4>
            </div>
          </div>
        </div>
        <div class="nc-actions" style="display:flex; gap:10px;">
          <button class="btn-ghost half" style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border-color:var(--blue); color:var(--blue);" onclick="window.open('https://maps.google.com/?q=0.5071,101.4451', '_blank')"><img src="https://img.icons8.com/fluency-systems-regular/48/118EEA/map-marker.png" width="18" height="18"> Gmaps</button>
          <button class="btn-primary half" style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px;" onclick="showToast('🧭 Membuka navigasi satelit...'); setTimeout(() => showToast('📍 Rute telah ditentukan!'), 2000);"><img src="https://img.icons8.com/fluency-systems-filled/48/FFFFFF/navigation.png" width="18" height="18"> Navigasi</button>
        </div>
      </div>
    </div>
    <nav class="bottom-nav blue-nav">
      <div class="bn-item" id="nav-home" onclick="goPage('home')">
        <img src="https://img.icons8.com/fluency-systems-regular/48/000000/home.png" width="24" height="24">
        <p>Beranda</p>
      </div>
      <div class="bn-item" id="nav-pickup" onclick="goPage('pickup-masuk')">
        <img src="https://img.icons8.com/fluency-systems-regular/48/000000/download.png" width="24" height="24">
        <p>Masuk</p>
      </div>
      <div class="bn-fab" onclick="showQRModal()">
        <div class="fab-circle blue-fab">
          <img src="https://img.icons8.com/fluency-systems-regular/48/FFFFFF/qr-code.png" width="28" height="28">
        </div>
        <p>Scan</p>
      </div>
      <div class="bn-item active" id="nav-timbang">
        <img src="https://img.icons8.com/fluency-systems-regular/48/000000/scales.png" width="24" height="24">
        <p>Timbang</p>
      </div>
      <div class="bn-item" id="nav-profile" onclick="goPage('profil')">
        <img src="https://img.icons8.com/fluency-systems-regular/48/000000/user.png" width="24" height="24">
        <p>Profil</p>
      </div>
    </nav>
  </div>
</div>
