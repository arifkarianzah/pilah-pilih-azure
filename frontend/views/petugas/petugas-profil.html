<!-- ==================== PROFIL PETUGAS ==================== -->
<div id="page-petugas-profil" class="page">
  <div class="phone-frame app-frame">
    <div class="profile-hero-blue">
      <div class="phb-blur"></div>
      <div class="phb-top-bar">
        <button class="back-btn" onclick="goPage('home')" style="color:white;border-color:rgba(255,255,255,0.2)"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
        <button class="txt-btn-sm" onclick="showEditProfilModal()" style="color:white;background:rgba(255,255,255,0.15);border-radius:12px;padding:6px 12px;">Edit</button>
      </div>
      <div class="phb-av-wrap" onclick="document.getElementById('petugasAvatarUpload').click()" style="cursor:pointer;position:relative;" title="Ubah Foto Profil">
        <div class="phb-av" id="profAv" style="background-size:cover;background-position:center;">--</div>
        <div class="phb-online"></div>
        <input type="file" id="petugasAvatarUpload" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
      </div>
      <h2 class="phb-name" id="profName">Memuat...</h2>
      <p class="phb-role">Petugas Pickup Terverifikasi</p>
      <div class="phb-stats">
        <div class="phs-item"><p class="phs-v" id="profPickup">0</p><p class="phs-l">Pickup</p></div>
        <div class="phs-sep"></div>
        <div class="phs-item"><p class="phs-v" id="profRating">0.0</p><p class="phs-l">Rating</p></div>
      </div>
      <div style="background: rgba(255,255,255,0.15); border-radius: 12px; margin: 16px 20px 0; padding: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.2);">
        <div>
          <p style="font-size: 11px; opacity: 0.9; margin: 0;">Saldo Dompet Petugas</p>
          <h3 id="profWalletBalance" style="margin: 4px 0 0 0; font-size: 18px; color: white;">Rp 0</h3>
        </div>
        <button class="btn-primary-sm" style="background: var(--primary); border: none; color: white;" onclick="showTopUpModal()">Top Up</button>
      </div>
    </div>
    <div class="scroll-content">
      <div style="height:8px"></div>
      <div class="pm-group">
        <p class="pm-group-lbl">AKUN</p>
        <div class="pm-item" onclick="showEditProfilModal()"><span class="pm-ico"><img src="https://img.icons8.com/fluency-systems-regular/48/1DB954/edit--v1.png" width="20" height="20"></span><span class="pm-lbl">Edit Profil</span><span class="pm-arr">›</span></div>
        <div class="pm-item" onclick="goPage('riwayat')"><span class="pm-ico"><img src="https://img.icons8.com/fluency-systems-regular/48/1DB954/order-history.png" width="20" height="20"></span><span class="pm-lbl">Riwayat Pickup</span><span class="pm-arr">›</span></div>
      </div>
      <div class="pm-group">
        <p class="pm-group-lbl">PENGATURAN</p>
        <div class="pm-item" onclick="toggleTheme()"><span class="pm-ico"><img src="https://img.icons8.com/fluency-systems-regular/48/1DB954/moon-symbol.png" width="20" height="20"></span><span class="pm-lbl">Mode Gelap</span><div class="toggle-sw active" id="profThemeSw"><div class="toggle-thumb"></div></div></div>
      </div>
      <button class="btn-danger w-full mt16 mb90" onclick="logout()">Keluar dari Akun</button>
    </div>

    <!-- Edit Profil Modal -->
    <div id="editProfilModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:flex-end;">
      <div style="background:var(--bg); width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:24px; animation: slideUp 0.3s ease;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <h3 style="margin:0; color:var(--t1);">Edit Profil</h3>
          <button class="btn-ghost" style="padding:8px 12px; border:none;" onclick="document.getElementById('editProfilModal').style.display='none'">Tutup</button>
        </div>
        
        <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:20px;">
          <div id="editProfAv" style="width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); display:flex; align-items:center; justify-content:center; color:white; font-size:24px; font-weight:bold; margin-bottom:12px; cursor:pointer;" onclick="document.getElementById('petugasAvatarUpload').click()">--</div>
          <button class="btn-primary-sm" onclick="document.getElementById('petugasAvatarUpload').click()">Ubah Foto</button>
        </div>

        <div class="fg">
          <label>Nama Lengkap</label>
          <input type="text" id="editProfName" class="ig-input" style="width:100%; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; color:var(--t1);" placeholder="Masukkan nama">
        </div>
        
        <div class="fg">
          <label>Nomor HP</label>
          <input type="text" id="editProfPhone" class="ig-input" style="width:100%; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; color:var(--t1);" placeholder="08...">
        </div>

        <button class="btn-primary w-full mt16" onclick="savePetugasProfil()">Simpan Perubahan</button>
      </div>
    </div>
    <nav class="bottom-nav">
      <div class="bn-item" id="nav-home" onclick="goPage('home')">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:4px"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <p>Beranda</p>
      </div>
      <div class="bn-item" id="nav-masuk" onclick="goPage('pickup-masuk')">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:4px"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
        <p>Masuk</p>
      </div>
      <div class="bn-fab" onclick="showQRModal()">
        <div class="fab-circle" style="display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5" height="5"></rect><rect x="16" y="3" width="5" height="5"></rect><rect x="3" y="16" width="5" height="5"></rect><path d="M21 16v5h-5"></path><line x1="10" y1="10" x2="14" y2="14"></line></svg>
        </div>
        <p>Scan</p>
      </div>
      <div class="bn-item" id="nav-timbang" onclick="goPage('penimbangan')">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:4px"><line x1="12" y1="2" x2="12" y2="22"></line><line x1="3" y1="6" x2="21" y2="6"></line><circle cx="6" cy="14" r="3"></circle><circle cx="18" cy="14" r="3"></circle><polyline points="6 6 6 11"></polyline><polyline points="18 6 18 11"></polyline></svg>
        <p>Timbang</p>
      </div>
      <div class="bn-item" id="nav-profil" onclick="goPage('profil')">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:4px"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <p>Profil</p>
      </div>
    </nav>
  </div>
</div>
