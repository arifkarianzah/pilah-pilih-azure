<!-- ==================== RIWAYAT PICKUP ==================== -->
<div id="page-riwayat-pickup" class="page">
  <div class="phone-frame app-frame">
    <div class="page-hdr">
      <button class="back-btn" onclick="goPage('home')"><svg viewBox="0 0 24 24">
          <use href="#i-back" />
        </svg></button>
      <h2>Riwayat Pickup</h2>
      <button class="icon-btn"></button>
    </div>
    <div class="scroll-content">
      <div class="filter-scroll">
        <span class="filter-chip active">Semua</span>
        <span class="filter-chip">Menunggu</span>
        <span class="filter-chip">Berjalan</span>
        <span class="filter-chip">Selesai</span>
        <span class="filter-chip">Dibatalkan</span>
      </div>
      <div class="history-list" id="riwayatList">
        <p style="text-align:center;padding:20px;color:var(--t4);">Memuat riwayat...</p>
      </div>
      <div style="height:90px"></div>
    </div>
    <nav class="bottom-nav">
      <div class="bn-item" onclick="goPage('home')">
        <img src="https://img.icons8.com/fluency-systems-regular/48/000000/home.png" width="24" height="24">
        <p>Beranda</p>
      </div>
      <div class="bn-item active" onclick="goPage('riwayat-pickup')">
        <img src="https://img.icons8.com/fluency-systems-regular/48/000000/box.png" width="24" height="24">
        <p>Pickup</p>
      </div>
      <div class="bn-fab" onclick="goPage('jual-sampah')">
        <div class="fab-circle">
          <img src="https://img.icons8.com/fluency-systems-filled/48/FFFFFF/recycle-sign.png" width="28" height="28">
        </div>
        <p>Jual</p>
      </div>
      <div class="bn-item" onclick="goPage('reward')">
        <img src="https://img.icons8.com/fluency-systems-regular/48/000000/gift.png" width="24" height="24">
        <p>Reward</p>
      </div>
      <div class="bn-item" onclick="goPage('profile')">
        <img src="https://img.icons8.com/fluency-systems-regular/48/000000/user.png" width="24" height="24">
        <p>Profil</p>
      </div>
    </nav>
  </div>
</div>
