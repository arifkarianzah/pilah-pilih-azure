<!-- ==================== DASHBOARD PENGEPUL ==================== -->
<div id="page-home" class="page">
  <div class="phone-frame app-frame">
    <!-- Header -->
    <div class="app-header" style="background: var(--primary); border: none;">
      <div class="hdr-left">
        <div class="hdr-av" id="userAv" style="background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); box-shadow: none; color: white;">P</div>
        <div>
          <p class="hdr-greet" style="color: rgba(255,255,255,0.8);">Halo, Bank Sampah</p>
          <p class="hdr-name" id="userName" style="color: white;">Pengepul</p>
        </div>
      </div>
    </div>

    <!-- Wallet Section -->
    <div class="scroll-content" style="background: var(--bg); padding-top: 0;">
      <!-- DANA STYLE HERO -->
      <div class="dana-hero" style="background: var(--primary); padding: 12px 20px 48px; color: white; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <p style="font-size:13px; font-weight:500; opacity:0.9; margin-bottom:4px;">Saldo Tersedia</p>
            <h2 id="valTersedia" style="font-size:32px; font-weight:800; letter-spacing:-0.02em;">Rp 0</h2>
          </div>
          <div style="text-align:right;">
            <p style="font-size:11px; opacity:0.8; margin-bottom:4px;">Escrow (Ditahan)</p>
            <div style="display:flex; gap:8px; font-size:12px; font-weight:700; background:rgba(255,255,255,0.15); padding:4px 10px; border-radius:99px;">
              <span id="valDitahan" style="color:#FCD34D;">Rp 0</span>
            </div>
          </div>
        </div>
      </div>

      <!-- DANA QUICK ACTIONS -->
      <div class="dana-actions" style="margin: -32px 20px 20px; background: var(--surface); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; box-shadow: var(--sh-md); border: 1px solid var(--border); position: relative; z-index: 10;">
        <div class="da-item" onclick="goPage('stok')" style="text-align:center; flex:1; cursor:pointer;">
          <div style="width:44px; height:44px; margin:0 auto 8px; border-radius:14px; background:var(--primary-light); display:flex; align-items:center; justify-content:center;"><img src="https://img.icons8.com/fluency-systems-regular/48/00D084/box.png" width="24"></div>
          <p style="font-size:11px; font-weight:600; color:var(--t1);">Stok</p>
        </div>
        <div class="da-item" onclick="goPage('dompet')" style="text-align:center; flex:1; cursor:pointer;">
          <div style="width:44px; height:44px; margin:0 auto 8px; border-radius:14px; background:var(--primary-light); display:flex; align-items:center; justify-content:center;"><img src="https://img.icons8.com/fluency-systems-regular/48/00D084/wallet.png" width="24"></div>
          <p style="font-size:11px; font-weight:600; color:var(--t1);">Dompet</p>
        </div>
        <div class="da-item" onclick="goPage('jadwal')" style="text-align:center; flex:1; cursor:pointer;">
          <div style="width:44px; height:44px; margin:0 auto 8px; border-radius:14px; background:var(--primary-light); display:flex; align-items:center; justify-content:center;"><img src="https://img.icons8.com/fluency-systems-regular/48/00D084/calendar.png" width="24"></div>
          <p style="font-size:11px; font-weight:600; color:var(--t1);">Jadwal</p>
        </div>
        <div class="da-item" onclick="goPage('konfirmasi')" style="text-align:center; flex:1; cursor:pointer;">
          <div style="width:44px; height:44px; margin:0 auto 8px; border-radius:14px; background:var(--primary-light); display:flex; align-items:center; justify-content:center;"><img src="https://img.icons8.com/fluency-systems-regular/48/00D084/checked--v1.png" width="24"></div>
          <p style="font-size:11px; font-weight:600; color:var(--t1);">Terima</p>
        </div>
      </div>

      <div class="section-hdr" style="margin-top: 24px; margin-bottom: 8px;">
        <h3>Transaksi Terakhir</h3>
      </div>
      <div id="homeRecentTrx" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
        <div style="background: var(--card2); border: 1px solid var(--border); padding: 16px; border-radius: 12px; text-align: center; color: var(--t4); font-size: 13px;">
          Memuat riwayat transaksi...
        </div>
      </div>

      <div class="prof-menu-list">
        <div class="prof-menu-item" onclick="goPage('laporan')">
          <div class="pmi-icon" style="color: #00D084; background: rgba(17, 142, 234, 0.1);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></div>
          <div class="pmi-text">
            <h4>Laporan & Statistik</h4>
            <p>Ringkasan transaksi pengepul</p>
          </div>
          <div class="pmi-arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
        </div>
      </div>
    </div>

    <div style="height:90px"></div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <div class="bn-item active" id="nav-home" onclick="goPage('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <p>Beranda</p>
      </div>
      <div class="bn-item" id="nav-riwayat" onclick="goPage('riwayat')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <p>Riwayat</p>
      </div>
      <div class="bn-item" onclick="goPage('notifikasi')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <p>Notifikasi</p>
      </div>
      <div class="bn-item" onclick="goPage('profil')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <p>Profil</p>
      </div>
    </nav>
  </div>
</div>
